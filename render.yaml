services:
  # Backend Spring Boot Service
  - type: web
    name: teamflow-backend
    runtime: docker
    dockerfilePath: infrastructure/docker/Dockerfile.backend
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: teamflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # Frontend React SPA Service
  - type: web
    name: teamflow-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: teamflow-db
    plan: free
    region: oregon
    databaseName: teamflow_db
    user: teamflow_user
